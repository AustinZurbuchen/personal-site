<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Austin Zurbuchen — Passionate Software Developer</title>
    <meta
      name="description"
      content="Front End Developer focused on writing clean, elegant and efficient code. ReactJS, JavaScript, NodeJS, ExpressJS. Folsom, California."
    />
    <link rel="canonical" href="https://austinzurbuchen.com/" />

    <meta name="theme-color" content="#22a39f" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Open Graph. All URLs below are absolute on purpose: %PUBLIC_URL% expands to
      the EMPTY STRING in this project (package.json "homepage" supplies only a
      pathname), so "%PUBLIC_URL%/og-image.png" would emit a root-relative URL.
      Slack tolerates that; LinkedIn and X commonly drop it, producing a card with
      a title and no image while the tag looks correct in view-source.
    -->
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://austinzurbuchen.com/" />
    <meta property="og:site_name" content="Austin Zurbuchen" />
    <meta property="og:title" content="Austin Zurbuchen — Passionate Software Developer" />
    <meta
      property="og:description"
      content="Front End Developer focused on writing clean, elegant and efficient code. ReactJS, JavaScript, NodeJS, ExpressJS. Folsom, California."
    />
    <meta property="profile:first_name" content="Austin" />
    <meta property="profile:last_name" content="Zurbuchen" />
    <meta property="og:image" content="https://austinzurbuchen.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Austin Zurbuchen — Passionate Software Developer. Folsom, California. ReactJS · JavaScript · NodeJS · HTML5. austinzurbuchen.com"
    />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Austin Zurbuchen — Passionate Software Developer" />
    <meta
      name="twitter:description"
      content="Front End Developer focused on writing clean, elegant and efficient code. ReactJS, JavaScript, NodeJS, ExpressJS. Folsom, California."
    />
    <meta name="twitter:image" content="https://austinzurbuchen.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Austin Zurbuchen — Passionate Software Developer. Folsom, California. ReactJS · JavaScript · NodeJS · HTML5. austinzurbuchen.com"
    />
    <!--
      twitter:site and twitter:creator are intentionally omitted: no X handle
      exists in the resume data (links carries only email, github, linkedin).
      Do not guess one. The card renders in full without them; only the
      attribution byline is missing.
      <meta name="twitter:site" content="@handle" />
      <meta name="twitter:creator" content="@handle" />
    -->

    <!--
      Deliberately NO schema.org worksFor and no Organization node below. Every
      work entry has isCurrent=false and the most recent role ended 2026-05, so
      there is no current employer. worksFor has no endDate slot and would assert
      present employment in machine-readable form. An OrganizationRole wrapper is
      not a safe substitute — naive parsers read the nested worksFor as current.
      Do not add either without a role whose isCurrent is true.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://austinzurbuchen.com/#person",
            "name": "Austin Zurbuchen",
            "url": "https://austinzurbuchen.com/",
            "jobTitle": "Front End Developer",
            "description": "Front End Developer who focuses on writing clean, elegant and efficient code. Experienced with front end technologies such as Angular and React, and back end technologies such as Node.",
            "email": "mailto:austinzurbuchen@gmail.com",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Folsom",
              "addressRegion": "California"
            },
            "knowsAbout": [
              "ReactJS",
              "JavaScript",
              "HTML5",
              "NodeJS",
              "ExpressJS",
              "Git",
              "Okta"
            ],
            "alumniOf": {
              "@type": "CollegeOrUniversity",
              "name": "San Jose State University"
            },
            "sameAs": [
              "https://github.com/AustinZurbuchen",
              "https://www.linkedin.com/in/austin-zurbuchen-638638105/"
            ],
            "mainEntityOfPage": { "@id": "https://austinzurbuchen.com/#profilepage" }
          },
          {
            "@type": "ProfilePage",
            "@id": "https://austinzurbuchen.com/#profilepage",
            "url": "https://austinzurbuchen.com/",
            "name": "Austin Zurbuchen",
            "inLanguage": "en",
            "mainEntity": { "@id": "https://austinzurbuchen.com/#person" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript><h1>Austin Zurbuchen</h1><p>Passionate Software Developer — Folsom, California</p><p>Enable JavaScript to view the full resume, or reach me at <a href="mailto:austinzurbuchen@gmail.com">austinzurbuchen@gmail.com</a>, <a href="https://github.com/AustinZurbuchen">GitHub</a>, or <a href="https://www.linkedin.com/in/austin-zurbuchen-638638105/">LinkedIn</a>.</p></noscript>
    <script src="%PUBLIC_URL%/env-config.js"></script>
    <div id="root"></div>
  </body>
</html>
