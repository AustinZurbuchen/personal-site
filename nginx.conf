server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # The public site is READ-ONLY, enforced here rather than trusted to the
    # application. Nothing on the public internet needs to write, so no
    # non-GET method reaches Flask from the WAN regardless of any bug in
    # require_token. The admin vhost (stage 2) is a separate server block on
    # an unpublished port and does not carry this restriction.
    limit_except GET HEAD {
      deny all;
    }

    proxy_pass http://personal-site-py:5000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
