server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # The public site is READ-ONLY, enforced here rather than trusted to the
    # application. Nothing on the public internet needs to write, so no
    # non-GET method reaches Flask from the WAN regardless of any bug in
    # require_token. The admin vhost (stage 2) is a separate server block on
    # an unpublished port and does not carry this restriction.
    limit_except GET HEAD {
      deny all;
    }

    proxy_pass http://personal-site-py:5000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}

# ---------------------------------------------------------------------------
# Admin vhost (stage 2). Same image, same container, same document root as the
# block above — only the port and two locations differ. The `listen 80` block
# is not touched: not a character, not the indentation, not the comment. Do NOT
# factor the repeated proxy_set_header lines out into an include, because that
# edit would rewrite the public block, and the point of the read-only clamp is
# that it never moves.
#
# THIS PORT IS NEVER PUBLISHED THROUGH NGINX PROXY MANAGER. There is no proxy
# host and no stream for it, and there must never be one: /api/ here has no
# method restriction, so it is the only path in the system that can reach
# POST /session and PUT /updateResume. On the NAS it is published bound to a
# single LAN address (Unraid template -> Advanced View -> Extra Parameters ->
# `--publish <lan-ip>:8081:8081`), never on 0.0.0.0. A plain Port entry in the
# template has no host-IP field and always binds every interface.
#
# The REACT_APP_ADMIN flag below is COSMETIC. It only tells the bundle whether
# to paint edit UI. It is not a permission and it is not a secret — both vhosts
# serve the identical bundle from the identical root, and anyone who can load
# this page can flip the flag from a console. The real boundary is two things:
# (a) this port not being routable from the WAN, and (b) the session token,
# which Flask's require_session checks on every write regardless of what the
# browser believes about itself.
# ---------------------------------------------------------------------------
server {
  listen 8081;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Deliberately NO limit_except. The public block's `deny all` answers 403
    # to POST and PUT, so writes cannot pass through it — that clamp is doing
    # its job and is not to be relaxed. This is the whole reason a second
    # server block exists rather than a shared one.
    proxy_pass http://personal-site-py:5000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Overrides the env-config.js that docker-entrypoint.d/40-env-config.sh writes
  # at container start — for THIS vhost only. Both vhosts share one document
  # root, so the override has to be a location match rather than a second file
  # on disk. An exact `=` match beats any prefix match, so this wins over
  # `location /` no matter what order the blocks are written in.
  #
  # One line, single-quoted: no `$` to interpolate and no backslash escapes to
  # depend on the config lexer for.
  #
  # "/api" carries a LEADING SLASH on purpose. "api" (what the Unraid template
  # currently injects for the public vhost) is a RELATIVE url and resolves to
  # /api/getResume only because this app has exactly one route. src/App.test.js
  # pins that invariant. Change the template to "/api" too — it is a no-op today
  # and stops being one the first time a second route is added.
  #
  # DRIFT: this literal is the one place the proxy prefix is hardcoded rather
  # than injected. If /api/ ever moves, change it here AND in the template.
  location = /env-config.js {
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    return 200 'window.__ENV__ = { REACT_APP_SERVER_URL: "/api", REACT_APP_ADMIN: true };';
  }

  location / {
    try_files $uri /index.html;
  }
}
