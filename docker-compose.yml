services:
  personal-site:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REACT_APP_SERVER_URL: ${REACT_APP_SERVER_URL:-}
    # Matches the Unraid container's published port. Production does not use
    # this file, but a mismatch here reads as a second source of truth.
    ports:
      - "8080:80"
      # Admin vhost. BOUND TO LOOPBACK ON PURPOSE — "8081:8081" would bind
      # 0.0.0.0, and /api/ on this port has no limit_except, so an unbound
      # mapping puts POST /session and PUT /updateResume in front of anything
      # that can route to the host. On the NAS the equivalent is
      # `--publish <lan-ip>:8081:8081` in the Unraid template's Extra
      # Parameters; never a plain Port entry, which has no host-IP field and
      # always binds every interface.
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

# Shared with the personal-site-py service so nginx.conf can proxy /api/ to
# http://personal-site-py:5000/ by container name. Declared external because
# the network is created and owned outside these compose files.
networks:
  default:
    name: zurbnet
    external: true
